apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 86.2.3
    releaseName: kube-prometheus-stack
    namespace: monitoring
    valuesFile: values.yaml

resources:
  - grafana-admin-sealedsecret.yaml

# Свои дашборды: JSON в dashboards/, по одному ConfigMap на дашборд
# (большие JSON в одном ConfigMap упираются в лимит аннотации last-applied 256KB).
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Homelab

configMapGenerator:
  - name: rpi-temps-dashboard
    namespace: monitoring
    files:
      - dashboards/rpi-temps.json
