prometheusOperator:
  admissionWebhooks:
    enabled: false

grafana:
  enabled: true
  initChownData:
    enabled: false
  # Логин/пароль admin из SealedSecret (grafana-admin-sealedsecret.yaml).
  # Без этого чарт генерирует случайный пароль на каждый рендер Argo ->
  # секрет перезаписывается и Grafana рестартует после любого коммита.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Дашборды подхватываются sidecar'ом из ConfigMap с label grafana_dashboard=1
  # в любом namespace; папка в Grafana — из аннотации grafana_folder.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      # дефолтные дашборды kube-prometheus-stack -> папка Kubernetes
      annotations:
        grafana_folder: Kubernetes
      provider:
        foldersFromFilesStructure: true
        # правки из UI не сохраняются — источник правды git
        allowUiUpdates: false
  persistence:
    enabled: true
    storageClassName: local-path
    size: 10Gi
  service:
    type: NodePort
    nodePort: 30000
  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web
    hosts:
      - grafana.homelab

prometheus:
  enabled: true
  prometheusSpec:
    replicas: 1
    retention: 7d
    additionalScrapeConfigs:
      - job_name: "external-node-exporters"
        static_configs:
          - targets:
              - "192.168.0.110:9100"
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 30Gi
  service:
    type: NodePort
    nodePort: 30001
  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web
    hosts:
      - prometheus.homelab

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
  service:
    type: NodePort
    nodePort: 30002
  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web
    hosts:
      - alert.homelab

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
